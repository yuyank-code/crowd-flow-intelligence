services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/crowd_flow.db
      CORS_ORIGINS: '["http://localhost:8080"]'
    ports:
      - "8000:8000"
    volumes:
      - crowdflow-data:/data
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
volumes:
  crowdflow-data:
